<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="popup-shell">
        <section class="popup-panel" aria-labelledby="popup-title">
            <header class="popup-header">
                <p class="popup-eyebrow" id="popup-badge"></p>
                <h1 class="popup-title" id="popup-title"></h1>
            </header>

            <div class="popup-content">
                <p class="popup-body" id="popup-body"></p>
            </div>

            <section class="popup-toggle" aria-labelledby="popup-toggle-label popup-toggle-state" aria-describedby="popup-toggle-help">
                <div class="popup-toggle-row">
                    <div class="popup-toggle-copy">
                        <p class="popup-toggle-label" id="popup-toggle-label"></p>
                        <p class="popup-toggle-state" id="popup-toggle-state"></p>
                    </div>

                    <label class="popup-switch">
                        <input class="popup-switch-input" id="popup-toggle-input" type="checkbox" role="switch" aria-labelledby="popup-toggle-label popup-toggle-state">
                        <span class="popup-switch-track" aria-hidden="true"></span>
                    </label>
                </div>

                <p class="popup-toggle-help" id="popup-toggle-help"></p>
            </section>

            <div class="popup-status-stack">
                <p class="popup-note" id="popup-note"></p>
                <p class="popup-detail" id="popup-detail" aria-live="polite" hidden></p>
            </div>

            <div class="popup-actions">
                <button class="popup-button" id="popup-primary-btn" type="button"></button>
            </div>
        </section>
    </main>

    <script src="../utils/index.js"></script>
    <script src="./index.js"></script>
</body>
</html>
