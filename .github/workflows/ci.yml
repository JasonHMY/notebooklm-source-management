name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: deps
        run: npm ci

      # Each check runs even if an earlier one failed, so one failure does not hide
      # the others; the job is still marked failed. Only a real prerequisite gates a step.
      - run: npm run lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      - run: npm run test:unit
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      - id: browsers
        run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      - run: npm run test:smoke
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          CI: true
          PLAYWRIGHT_HEADLESS: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            output/playwright
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - run: npm run package
        if: always()

      - name: Upload package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: release/*.zip
          if-no-files-found: ignore
          retention-days: 14
